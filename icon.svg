<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="周礼体">
  <defs>
    <linearGradient id="zd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8905a"/>
      <stop offset="1" stop-color="#7a4e2d"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ec"/>
      <stop offset="1" stop-color="#f0e4cf"/>
    </linearGradient>
  </defs>
  <!-- 竹简底的册页 -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#bg)"/>
  <!-- 三根竹简 -->
  <rect x="14" y="12" width="7" height="40" rx="3" fill="url(#zd)" opacity="0.9"/>
  <rect x="28.5" y="12" width="7" height="40" rx="3" fill="url(#zd)" opacity="0.9"/>
  <rect x="43" y="12" width="7" height="40" rx="3" fill="url(#zd)" opacity="0.9"/>
  <!-- 编绳 -->
  <rect x="11" y="22" width="42" height="2.6" rx="1.3" fill="#5a3a20" opacity="0.75"/>
  <rect x="11" y="39" width="42" height="2.6" rx="1.3" fill="#5a3a20" opacity="0.75"/>
  <!-- 简上一笔：一点的「点」与一道横 -->
  <circle cx="31.8" cy="29.5" r="1.5" fill="#f7efe2"/>
  <rect x="27" y="33" width="10" height="1.8" rx="0.9" fill="#f7efe2"/>
</svg>
